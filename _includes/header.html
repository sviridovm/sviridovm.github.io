{% assign data = site.data.home.me %}
<section class="container text-center top-section" id="home">
    <h1 class="name animate__animated animate__fadeInRight animate_faster">{{ data.name }}
    </h1>

    <div class="text-left">
        <div class="quote animate__animated animate__lightSpeedInLeft animate__slow text-white">{{ data.quote }}
        </div>

        <div class="social-icons animate__fadeIn">
            <a href="{{ data.github }}" class="social-icon animate__fadeIn" target="_blank" rel="noopener noreferrer">
                <i class="fab fa-github"></i>
            </a>


            <a href="{{ data.linkedin }}" class="social-icon animate__fadeIn" target="_blank" rel="noopener noreferrer">
                <i class="fab fa-linkedin"></i>
            </a>

            <a href="{{ data.resume }}"
            class="social-icon resume-icon"
            target="_blank"
            rel="noopener noreferrer"
            aria-label="Resume"
            title="Resume">

                <i class="fas fa-file-alt"></i>
                <span class="resume-label">CV</span>

            </a>

        </div>
        <div class="col-md-12 ">
            <span class="description animate__animated"></span>
        </div>
    </div>

</section>
