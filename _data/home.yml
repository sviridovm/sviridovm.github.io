experience:
  - title: Robotics Software Engineer Intern
    company: Dassault Systems Delmia
    start: June 2026
    end: Present
    bullets:
    - Developed a GPU-accelerated LiDAR simulation framework in C++/CUDA using Nvidia cuBQL, achieving a 113× speedup over an optimized CPU baseline (tinyBVH) across scenes up to 2M triangles at 512K rays/query
    - Built an autonomous weld-seam trajectory correction pipeline that identifies parts via OCR, locates and extracts the weld seam using edge detection on RGB-D scans, then fuses the measured seam with the nominal digital-twin trajectory to generate a corrected path accounting for real-world part and fixturing error
    - Created a Python inference server for SAM-6D pose estimation, with a CAD registration API auto-generating reference views via BlenderProc and a backend supporting multiple segmentation and pose estimation models
    - Bridged a standalone C++ application to ROS2 over FastDDS middleware by generating interface definitions and their C++ codegen structs to publish/subscribe to ROS2 topics from outside the ROS2 process space

  
  - title: Software Engineer Intern
    company: Dassault Systems Delmia
    start: May 2025
    end: August 2025
    bullets:
    - Built a synthetic data generation pipeline in Python to programmatically augment large teleoperation datasets with configurable texture, lighting, material, and trajectory transformations to improve dataset robustness
    - Developed infrastructure to benchmark Vision-Language-Action (VLA) models for industrial manipulation tasks across latency, accuracy, and deployment constraints
    - Designed real-time perception pipelines in ROS2 for industrial object detection, pose estimation, and motion planning and validated them in Mujoco simulation


